    <script>
      (function() {
        try {
          var APP_VERSION = "v5.21.0_force_clean_20260918";
          var currentLock = localStorage.getItem("scout_version_lock");
          if (currentLock !== APP_VERSION) {
            console.log("Version update detected (" + currentLock + " -> " + APP_VERSION + "). Cleaning legacy service workers and client cache stores...");
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              }).catch(function(e) { console.warn("SW unregister notice:", e); });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              }).catch(function(e) { console.warn("Cache delete notice:", e); });
            }
            if ('indexedDB' in window) {
              try {
                indexedDB.deleteDatabase('genotype-scout-db');
                indexedDB.deleteDatabase('keyval-store');
              } catch (idbErr) {
                console.warn("IDB delete notice:", idbErr);
              }
            }
            try {
              sessionStorage.clear();
              localStorage.clear();
            } catch (storageErr) {
              console.warn("Storage clear notice:", storageErr);
            }
            localStorage.setItem("scout_version_lock", APP_VERSION);
            localStorage.setItem("genotype_scout_cache_epoch", APP_VERSION);
          }
        } catch (e) {
          console.warn("Storage access restricted or unavailable:", e);
        }
      })();
    </script>
