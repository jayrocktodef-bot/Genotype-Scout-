<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Obsidian Radial -->
    <radialGradient id="bgObsidian" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c1a16"/>
      <stop offset="40%" stop-color="#100f0c"/>
      <stop offset="85%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>

    <!-- Metallic Gold Outer Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="15%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#b45309"/>
      <stop offset="65%" stop-color="#78350f"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Secondary Gold Rim (Bevel Counter-light) -->
    <linearGradient id="goldBevel" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <!-- Core Emblem Gold Gradient -->
    <linearGradient id="emblemGold" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Teal Genomic Precision Signal Gradient -->
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="ambientGoldBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fde047" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Gold Back-Glow -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.18" filter="url(#ambientGoldBloom)"/>

  <!-- Base Squircle Container with 3D Drop Shadow -->
  <g filter="url(#goldDropShadow)">
    <!-- Outer Metallic Gold Bevel (Extruded Ring) -->
    <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#goldRim)"/>
    
    <!-- Recessed Inset Trench -->
    <rect x="42" y="42" width="428" height="428" rx="94" fill="url(#goldBevel)" opacity="0.9"/>
    
    <!-- Obsidian Face with Radial Sheen -->
    <rect x="46" y="46" width="420" height="420" rx="90" fill="url(#bgObsidian)"/>
    
    <!-- Hairline Inner Gold Rim Accent -->
    <rect x="48" y="48" width="416" height="416" rx="88" fill="none" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="52" y="52" width="408" height="408" rx="84" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  </g>

  <!-- Top Specular Highlight Arc on Obsidian Surface -->
  <path d="M 120 60 Q 256 46 392 60 Q 360 84 256 84 Q 152 84 120 60 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Inner Compass Grid Sub-Ticks (Precision Genomic Engineering) -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="3 8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.12"/>
  
  <!-- Tactile 3D Emblem: Intertwined Genomic Double-Helix & Scout Compass -->
  <g filter="url(#emblemShadow)">
    <!-- Outer Compass Crosshairs (Gold Trimmed) -->
    <line x1="256" y1="84" x2="256" y2="108" stroke="url(#emblemGold)" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="404" x2="256" y2="428" stroke="url(#emblemGold)" stroke-width="4" stroke-linecap="round"/>
    <line x1="84" y1="256" x2="108" y2="256" stroke="url(#emblemGold)" stroke-width="4" stroke-linecap="round"/>
    <line x1="404" y1="256" x2="428" y2="256" stroke="url(#emblemGold)" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Helix Strand -->
    <path d="M 180 128 C 230 180, 230 220, 180 256 C 130 292, 130 332, 180 384" 
          fill="none" stroke="url(#emblemGold)" stroke-width="16" stroke-linecap="round"/>

    <!-- Right Helix Strand -->
    <path d="M 332 128 C 282 180, 282 220, 332 256 C 382 292, 382 332, 332 384" 
          fill="none" stroke="url(#emblemGold)" stroke-width="16" stroke-linecap="round"/>

    <!-- Base Pair Rungs (Rungs with 3D nodes) -->
    <!-- Rung 1 -->
    <line x1="202" y1="160" x2="310" y2="160" stroke="#fde047" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="202" cy="160" r="6" fill="#fffbeb"/>
    <circle cx="310" cy="160" r="6" fill="#fbbf24"/>

    <!-- Rung 2 (Central Node - Cross) -->
    <line x1="220" y1="210" x2="292" y2="210" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="210" r="7" fill="#fde68a"/>
    <circle cx="292" cy="210" r="7" fill="#d97706"/>

    <!-- Center Core Scout Prism (Diamond Rhombus) -->
    <polygon points="256,230 282,256 256,282 230,256" fill="url(#emblemGold)" stroke="#fffbeb" stroke-width="2"/>
    <polygon points="256,236 276,256 256,276 236,256" fill="#14120e"/>
    <circle cx="256" cy="256" r="6" fill="#fbbf24"/>

    <!-- Rung 3 -->
    <line x1="220" y1="302" x2="292" y2="302" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="302" r="7" fill="#d97706"/>
    <circle cx="292" cy="302" r="7" fill="#fde68a"/>

    <!-- Rung 4 -->
    <line x1="202" y1="352" x2="310" y2="352" stroke="#fde047" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <circle cx="202" cy="352" r="6" fill="#fbbf24"/>
    <circle cx="310" cy="352" r="6" fill="#fffbeb"/>
  </g>

  <!-- Precision Clinical Signal LED (Machined Corner Rivet) -->
  <g transform="translate(382, 102)">
    <circle cx="0" cy="0" r="14" fill="#09090b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="url(#tealGlow)"/>
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Precision Inset Rim Specular Notch (Bottom Right Light Catcher) -->
  <path d="M 440 256 A 184 184 0 0 1 256 440" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
